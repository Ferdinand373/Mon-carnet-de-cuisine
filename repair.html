<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Installation du contrôle temporaire V2.4</title>
  <style>
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#f6f1e8;color:#17211e;margin:0;padding:30px
    }
    main{
      max-width:620px;margin:40px auto;background:#fffdf8;
      border:1px solid rgba(23,33,30,.12);border-radius:22px;padding:26px;
      box-shadow:0 12px 36px rgba(35,42,39,.12)
    }
    h1{font-family:Georgia,serif;font-weight:500;margin-top:0}
    p{line-height:1.55}
    .ok{color:#153c35;font-weight:750}
    .error{color:#8b3c35;font-weight:750}
    a{color:#153c35;font-weight:750}
  </style>
</head>
<body>
  <!-- search-enhancement.js temporary-correction-link.js -->
  <main>
    <h1>Contrôle temporaire V2.4</h1>
    <p id="status">
      Installation du bouton de contrôle en lecture seule, sans toucher aux recettes…
    </p>
    <p><a id="openApp" href="./" hidden>Ouvrir Mon Carnet</a></p>
  </main>

  <script>
    (async () => {
      const status = document.getElementById('status');
      const openApp = document.getElementById('openApp');

      try {
        if (!('serviceWorker' in navigator)) {
          throw new Error('Service worker indisponible');
        }

        const appBase = new URL('./', window.location.href).href;
        const registrations = await navigator.serviceWorker.getRegistrations();

        for (const registration of registrations) {
          if (registration.scope === appBase || registration.scope.startsWith(appBase)) {
            await registration.unregister();
          }
        }

        if ('caches' in window) {
          const names = await caches.keys();

          await Promise.all(
            names
              .filter(name => name.startsWith('mon-carnet-cuisine-'))
              .map(name => caches.delete(name))
          );
        }

        const registration = await navigator.serviceWorker.register(
          './sw.js?v=2.4-temp-check-1',
          { scope: './' }
        );

        await registration.update();
        await navigator.serviceWorker.ready;

        status.className = 'ok';
        status.textContent =
          'Installation terminée. Fermez Safari, puis rouvrez Mon Carnet depuis son icône.';
        openApp.hidden = false;
      } catch (error) {
        status.className = 'error';
        status.textContent = `L’installation n’a pas abouti : ${error.message}`;
        openApp.hidden = false;
      }
    })();
  </script>
</body>
</html>
